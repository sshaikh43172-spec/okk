<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question For You... ❤️</title>
    <style>
        body {
            background-color: #fff0f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d147a3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            border: 2px solid #ffb6c1;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(209, 71, 163, 0.1);
            max-width: 450px;
            position: relative;
        }
        h1 { color: #ff4d94; font-size: 2.2rem; margin-bottom: 10px; }
        .message { color: #666; font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; }
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; height: 50px; }
        .btn { padding: 12px 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 25px; border: none; transition: transform 0.2s, background-color 0.2s; }
        #yes-btn { background-color: #ff4d94; color: white; box-shadow: 0 4px 15px rgba(255, 77, 148, 0.4); }
        #yes-btn:hover { transform: scale(1.1); background-color: #ff1a75; }
        #no-btn { background-color: #ffe6f2; color: #ff4d94; position: relative; }
        .heart { color: #ff4d94; font-size: 3rem; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <div class="heart">❤️</div>
        <h1>Hey Beautiful,</h1>
        <p class="message">I was thinking about how incredibly amazing you are... and I wanted to ask you a very important question.</p>
        <h2 style="color: #ff1a75;">Will you go out on a date with me?</h2>
        <div class="btn-container">
            <button class="btn" id="yes-btn" onclick="celebrate()">Yes! 🥰</button>
            <button class="btn" id="no-btn">No 😢</button>
        </div>
    </div>
    <script>
        const noBtn = document.getElementById("no-btn");
        const mainCard = document.getElementById("main-card");
        noBtn.addEventListener("mouseover", () => {
            const padding = 50;
            const randomX = Math.floor(Math.random() * (window.innerWidth - noBtn.offsetWidth - padding));
            const randomY = Math.floor(Math.random() * (window.innerHeight - noBtn.offsetHeight - padding));
            noBtn.style.position = "fixed"; 
            noBtn.style.left = `${Math.max(padding, randomX)}px`;
            noBtn.style.top = `${Math.max(padding, randomY)}px`;
            const teasingTexts = ["Wait, look left!", "Wrong button!", "Nice try! 😉", "Not an option!", "Think again! ❤️"];
            noBtn.innerText = teasingTexts[Math.floor(Math.random() * teasingTexts.length)];
        });
        function celebrate() {
            mainCard.innerHTML = `
                <div class="heart" style="font-size: 5rem;">🎉💖🥂</div>
                <h1 style="color: #ff1a75; margin-top: 20px;">It's a Date!</h1>
                <p class="message" style="font-size: 1.2rem; font-weight: bold; color: #333;">Yay! You just made my entire week.</p>
                <p class="message">Get ready for an amazing time. I'll text you the secret details soon! 😉✨</p>
            `;
            document.body.style.backgroundColor = "#ffe6f2";
        }
    </script>
</body>
</html>
